<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>思睿一點通</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A2733;
    --pine:#4A7FA5;
    --pine-soft:#6FA0C4;
    --sage:#8FC1E3;
    --sage-pale:#A4DBE8;
    --mist:#F6FAFD;
    --brass:#E3A857;
    --brass-soft:#FBEBD3;
    --line:#DCEBF5;
    --white:#FFFFFF;
    --grey-pale:#F0F1F3;
    --radius:16px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--mist); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--mist); position:relative; padding-bottom:40px;}

  /* ===== Header ===== */
  header{
    background:var(--pine);
    color:var(--white);
    padding:28px 20px 26px;
    position:relative;
  }
  .trio-mark{display:flex; gap:6px; align-items:center; margin-bottom:18px;}
  .trio-mark span{width:8px; height:8px; border-radius:50%; background:var(--white); opacity:0.55;}
  .trio-mark span:nth-child(2){opacity:0.8;}
  .trio-mark span:nth-child(3){opacity:1;}
  .trio-mark b{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.14em;
    color:rgba(255,255,255,0.65); margin-left:8px; font-weight:500;
  }
  .greeting{font-family:var(--font-display); font-size:15px; color:rgba(255,255,255,0.75); font-weight:500;}
  h1{
    font-family:var(--font-display); font-size:26px; font-weight:700;
    margin:6px 0 0; letter-spacing:-0.01em;
  }
  .sub{font-size:13px; color:rgba(255,255,255,0.6); margin-top:6px;}

  /* ===== Groups ===== */
  main{padding:22px 18px 0;}
  .group{margin-bottom:26px;}
  .group-head{
    display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding:0 2px;
  }
  .group-index{
    font-family:var(--font-mono); font-size:11px; color:#7BA3D5;
    letter-spacing:0.08em; font-weight:500;
  }
  .group-title{font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--pine);}
  .group-count{
    margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--sage);
  }

  .card-grid{display:flex; flex-direction:column; gap:10px;}
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--white); border:1px solid var(--line);
    border-radius:var(--radius); padding:15px 16px;
    text-decoration:none; color:inherit;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:active{transform:scale(0.98);}
  .card:hover{border-color:var(--sage); box-shadow:0 4px 16px rgba(74,127,165,0.08);}
  .icon-box{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--sage-pale);
  }
  .icon-box svg{width:21px; height:21px; stroke:var(--pine); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .icon-box.brass-bg{background:var(--brass-soft);}
  .icon-box.brass-bg svg{stroke:var(--brass);}
  .card-text{flex:1; min-width:0;}
  .card-title{font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--ink);}
  .card-desc{font-size:12px; color:#6B7570; margin-top:2px;}
  .chevron{color:var(--sage); font-size:16px; flex-shrink:0;}

  .card.disabled{opacity:0.55; pointer-events:none;}
  .card.disabled .icon-box{background:var(--brass-soft);}
  .spot-list{display:flex; flex-direction:column; gap:12px;}
  .spot-card{
    display:flex; align-items:center; gap:14px;
    background:#A6DDE9;
    border-radius:18px; padding:15px 16px; position:relative; overflow:hidden;
    text-decoration:none; color:inherit;
  }
  .spot-card.green{background:#A7D7B5;}
  .spot-card.gold{background:#D4C3B0;}
  .spot-card.grey{background:#F0F1F3;}
  .spot-icon{
    width:46px; height:46px; border-radius:14px; flex-shrink:0;
    background:var(--white); display:flex; align-items:center; justify-content:center;
    position:relative; z-index:1;
  }
  .spot-icon svg{width:22px; height:22px; stroke:#1A2733; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .spot-card.gold .spot-icon{background:rgba(255,255,255,0.16);}
  .spot-card.gold .spot-icon svg{stroke:var(--white);}
  .spot-text{flex:1; position:relative; z-index:1;}
  .spot-title{font-family:var(--font-display); font-weight:700; font-size:14.5px; color:#1A2733;}
  .spot-desc{font-size:11.5px; color:#3A4650; margin-top:2px;}
  .spot-arrow{color:#3A4650; font-size:19px; position:relative; z-index:1;}
  .spot-card.gold .spot-title,
  .spot-card.gold .spot-desc,
  .spot-card.gold .spot-arrow{color:var(--white);}
  .spot-card.gold .spot-desc{color:rgba(255,255,255,0.75);}
  .spot-card.gold .spot-arrow{color:rgba(255,255,255,0.55);}
  .spot-card.disabled{opacity:0.55; pointer-events:none;}
  .spot-badge{
    font-family:var(--font-mono); font-size:9.5px; color:var(--white);
    background:rgba(255,255,255,0.22); padding:2px 8px; border-radius:20px; margin-left:6px;
  }

  /* ===== Detail overlay ===== */
  .detail{
    position:fixed; inset:0; background:var(--mist); z-index:50;
    display:none; flex-direction:column;
    max-width:480px; margin:0 auto;
  }
  .detail.open{display:flex;}
  .detail-head{
    background:var(--pine); color:var(--white); padding:18px 18px 20px;
    display:flex; align-items:center; gap:12px;
    border-radius:0 0 20px 20px;
  }
  .back-btn{
    width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.12);
    border:none; color:var(--white); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-title{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .detail-body{padding:26px 20px; flex:1; overflow-y:auto;}
  .placeholder{
    border:1.5px dashed var(--line); border-radius:var(--radius);
    padding:34px 20px; text-align:center; color:#8A928C;
  }
  .placeholder .ph-icon{font-size:26px; margin-bottom:10px;}
  .placeholder .ph-title{font-family:var(--font-display); font-weight:600; color:var(--pine); font-size:14px; margin-bottom:6px;}
  .placeholder .ph-desc{font-size:12.5px; line-height:1.6;}

  footer{
    text-align:center; padding:18px 0 4px; font-family:var(--font-mono);
    font-size:10.5px; color:#9AA29C; letter-spacing:0.06em;
  }

  /* ===== Policy content ===== */
  .policy-note{
    background:var(--brass-soft); border-radius:12px; padding:12px 14px;
    font-size:12px; color:#6B5330; line-height:1.6; margin-bottom:20px;
  }
  .policy-section{margin-bottom:26px;}
  .policy-section h3{
    font-family:var(--font-display); font-size:14px; font-weight:600;
    color:var(--pine); margin:0 0 4px; display:flex; align-items:center; gap:6px;
  }
  .policy-section h3 .num{
    font-family:var(--font-mono); font-size:11px; color:#7BA3D5;
  }
  .policy-desc{font-size:12.5px; color:#5A625C; line-height:1.6; margin-bottom:10px;}
  .data-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:6px;}
  .data-table th{
    text-align:left; font-family:var(--font-mono); font-weight:500; font-size:10.5px;
    color:var(--sage); padding:6px 6px; border-bottom:1.5px solid var(--pine);
    letter-spacing:0.02em;
  }
  .data-table td{padding:7px 6px; border-bottom:1px solid var(--line); color:var(--ink);}
  .data-table tr:nth-child(even){background:var(--grey-pale);}
  .data-table tr:last-child td{border-bottom:none;}
  .mini-list{font-size:12px; line-height:1.7; color:var(--ink); padding-left:18px; margin:6px 0;}
  .mini-list li{margin-bottom:4px;}
  .sub-label{
    font-family:var(--font-mono); font-size:10.5px; color:#7BA3D5;
    margin:10px 0 4px; letter-spacing:0.02em;
  }
  .policy-section h3 svg{width:16px; height:16px; stroke:var(--pine); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
  .tier-ladder{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
  .tier-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    background:var(--white); border:1px solid var(--line); border-radius:10px;
  }
  .tier-ladder .tier-row:nth-child(even){background:var(--grey-pale);}
  .tier-dot{width:9px; height:9px; border-radius:50%; background:var(--sage); flex-shrink:0;}
  .tier-row.gold .tier-dot{background:var(--brass);}
  .tier-name{font-family:var(--font-display); font-weight:600; font-size:12.5px; color:var(--ink); width:78px; flex-shrink:0;}
  .tier-cond{font-size:11px; color:#6B7570; line-height:1.4;}
  .prod-card{
    display:flex; gap:12px; align-items:center; padding:10px;
    background:var(--white); border:1px solid var(--line); border-radius:12px; margin-bottom:8px;
  }
  .prod-card img{width:54px; height:54px; object-fit:cover; border-radius:10px; flex-shrink:0; background:var(--sage-pale);}
  .prod-card .prod-info{flex:1;}
  .prod-card .prod-name{font-family:var(--font-display); font-weight:600; font-size:12.5px; color:var(--ink);}
  .prod-card .prod-meta{font-size:11px; color:#6B7570; margin-top:2px;}
  .pack-card{
    background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-bottom:10px; overflow:hidden;
  }
  .pack-card img{width:100%; border-radius:8px; margin-bottom:8px; display:block; background:#F7EFE0;}
  .pack-card.gold{border-color:var(--brass);}

  .prod-grid{display:flex; flex-direction:column; gap:10px;}
  .prod-mini{
    display:flex; align-items:center; gap:12px; padding:10px;
    background:var(--white); border:1px solid var(--line); border-radius:14px;
    cursor:pointer; text-decoration:none; color:inherit;
  }
  .prod-mini img{width:58px; height:58px; object-fit:cover; border-radius:10px; flex-shrink:0; background:var(--sage-pale);}
  .prod-mini .prod-mini-text{flex:1;}
  .prod-mini .prod-mini-title{font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--ink);}
  .prod-mini .prod-mini-sub{font-size:11px; color:#6B7570; margin-top:2px;}
  .prod-back{
    display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono);
    font-size:11px; color:var(--sage); margin-bottom:14px; cursor:pointer;
  }
  .prod-detail-header{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .prod-detail-header img{width:64px; height:64px; object-fit:cover; border-radius:12px; flex-shrink:0;}
  .prod-detail-header .prod-detail-name{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--pine);}
  .asset-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .asset-grid a{display:block; border-radius:10px; overflow:hidden; background:var(--sage-pale);}
  .asset-grid img{width:100%; height:120px; object-fit:cover; display:block;}
  .asset-video-wrap{margin-bottom:14px;}
  .asset-video-wrap video{width:100%; border-radius:12px; display:block; background:#000;}
  .link-list{display:flex; flex-direction:column; gap:10px;}
  .link-card{
    display:flex; align-items:center; gap:12px; padding:13px 14px;
    background:var(--white); border:1px solid var(--line); border-radius:14px;
    text-decoration:none; color:inherit;
  }
  .link-card .link-icon{
    width:40px; height:40px; border-radius:11px; background:#BCBDBF;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .link-card .link-icon svg{width:19px; height:19px; stroke:var(--pine); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}

  /* ===== Check-in / Garden ===== */
  .garden-box{
    background:linear-gradient(180deg, var(--sage-pale), var(--white));
    border-radius:20px; padding:20px 16px 16px; margin-bottom:16px; position:relative;
  }
  .garden-streak{text-align:center; margin-bottom:26px;}
  .garden-streak .streak-num{font-family:var(--font-display); font-size:34px; font-weight:700; color:var(--pine);}
  .garden-streak .streak-label{font-size:11px; color:#6B7570; margin-top:2px;}
  .garden-pot-wrap{position:relative; width:220px; height:220px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;}
  .garden-pot-wrap img{max-width:100%; max-height:100%;}
  .garden-pot-emoji{animation:potSway 4s ease-in-out infinite; transform-origin:bottom center; display:inline-block;}
  @keyframes potSway{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
  }
  .fruit-slot{
    position:absolute; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s ease;
    transform:translate(-50%,-50%);
  }
  .fruit-slot:active{transform:translate(-50%,-50%) scale(0.9);}
  .fruit-slot.locked{background:rgba(0,0,0,0.06); opacity:0.5; cursor:default;}
  .fruit-slot.ready{background:#E85D5D; box-shadow:0 0 0 4px rgba(232,93,93,0.25); animation:fruitPop .5s cubic-bezier(.34,1.56,.64,1) both, fruitPulse 1.6s ease-in-out 0.5s infinite;}
  .fruit-slot.claimed{background:var(--sage-pale); opacity:0.6; cursor:default;}
  .fruit-slot.big{width:50px; height:50px; background:var(--brass); box-shadow:0 0 0 5px rgba(227,168,87,0.3);}
  .fruit-slot svg{width:18px; height:18px; stroke:white; fill:none; stroke-width:2;}
  @keyframes fruitPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.12);}}
  @keyframes fruitPop{
    0%{transform:translate(-50%,-50%) scale(0); opacity:0;}
    60%{transform:translate(-50%,-50%) scale(1.25); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1);}
  }
  .fruit-slot.shaking{animation:fruitShake .4s ease !important;}
  @keyframes fruitShake{
    0%,100%{transform:translate(-50%,-50%) rotate(0) scale(1);}
    25%{transform:translate(-50%,-50%) rotate(-15deg) scale(1.1);}
    50%{transform:translate(-50%,-50%) rotate(15deg) scale(1.15);}
    75%{transform:translate(-50%,-50%) rotate(-10deg) scale(1.1);}
  }
  .checkin-btn{
    display:block; width:100%; background:var(--pine); color:white; border:none;
    border-radius:14px; padding:14px; font-family:var(--font-display); font-weight:700;
    font-size:14px; cursor:pointer; margin-bottom:8px;
  }
  .checkin-btn:disabled{background:#B8C0BC; cursor:default;}

  .like-checkin-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:10px;}
  .like-checkin-btn{
    width:80px; height:80px; border-radius:50%; border:2px solid var(--pine);
    background:var(--white); display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; transition:transform .12s ease;
  }
  .like-checkin-btn .btn-emoji{font-size:44px; line-height:1; transition:transform .2s ease;}
  .triple-drop-wrap{position:relative; width:52px; height:52px; transition:transform .2s ease;}
  .drop-item{position:absolute; font-size:22px; line-height:1;}
  .drop-top{top:0; left:50%; transform:translateX(-50%);}
  .drop-left{bottom:2px; left:2px;}
  .drop-right{bottom:2px; right:2px;}
  .like-checkin-btn:active{transform:scale(0.88);}
  .like-checkin-btn.liked{
    background:var(--sage-pale); border-color:var(--pine);
    animation:likeBounce .5s cubic-bezier(.34,1.56,.64,1);
  }
  .like-checkin-btn.liked .btn-emoji{transform:scale(1.1);}
  .like-checkin-btn.liked .triple-drop-wrap{transform:scale(1.15);}
  .like-checkin-btn:disabled{cursor:default;}
  @keyframes likeBounce{
    0%{transform:scale(1);}
    35%{transform:scale(1.35);}
    60%{transform:scale(0.92);}
    100%{transform:scale(1);}
  }
  .like-checkin-label{font-size:11.5px; color:#6B7570; font-family:var(--font-display); font-weight:600;}
  .like-burst{
    position:absolute; inset:-14px; pointer-events:none;
  }
  .like-burst span{
    position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%;
    background:var(--brass); opacity:0;
  }
  .like-checkin-btn.liked .like-burst span{animation:burstOut .55s ease-out both;}
  @keyframes burstOut{
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1) var(--burst-move);}
  }
  .like-burst span:nth-child(1){--burst-move:translate(0,-26px);}
  .like-burst span:nth-child(2){--burst-move:translate(18px,-18px);}
  .like-burst span:nth-child(3){--burst-move:translate(26px,0);}
  .like-burst span:nth-child(4){--burst-move:translate(18px,18px);}
  .like-burst span:nth-child(5){--burst-move:translate(0,26px);}
  .like-burst span:nth-child(6){--burst-move:translate(-18px,18px);}
  .like-burst span:nth-child(7){--burst-move:translate(-26px,0);}
  .like-burst span:nth-child(8){--burst-move:translate(-18px,-18px);}
  .garden-hint{font-size:11px; color:#8A928C; text-align:center;}
  .milestone-list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .milestone-row{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--white); border:1px solid var(--line); border-radius:12px;
  }
  .milestone-row.done{background:var(--sage-pale);}
  .milestone-dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0;}
  .milestone-row.done .milestone-dot{background:var(--sage);}
  .milestone-text{flex:1; font-size:12px; color:var(--ink);}
  .milestone-status{font-family:var(--font-mono); font-size:10.5px; color:#8A928C;}
  /* reveal modal */
  .reveal-overlay{
    position:fixed; inset:0; background:rgba(26,39,51,0.55); z-index:80;
    display:none; align-items:center; justify-content:center; padding:30px;
    opacity:0; transition:opacity .2s ease;
  }
  .reveal-overlay.open{display:flex; opacity:1;}
  .reveal-card{
    background:white; border-radius:20px; padding:28px 22px; text-align:center; max-width:300px;
    position:relative; overflow:visible;
    animation:revealPop .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes revealPop{
    0%{transform:scale(0.4) translateY(30px); opacity:0;}
    100%{transform:scale(1) translateY(0); opacity:1;}
  }
  .reveal-card .reveal-icon{font-size:40px; margin-bottom:10px; display:inline-block; animation:iconBounce .6s ease .2s both;}
  @keyframes iconBounce{
    0%{transform:scale(0) rotate(-20deg);}
    60%{transform:scale(1.3) rotate(10deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .reveal-card .reveal-title{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--pine); margin-bottom:6px;}
  .reveal-card .reveal-desc{font-size:12.5px; color:#5A625C; margin-bottom:18px; line-height:1.6;}
  .reveal-card button{
    background:var(--pine); color:white; border:none; border-radius:12px;
    padding:10px 24px; font-family:var(--font-display); font-weight:600; font-size:13px; cursor:pointer;
  }
  .confetti-piece{
    position:absolute; top:-10px; width:8px; height:8px; opacity:0.9;
    animation:confettiFall 1.6s ease-in forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0); opacity:1;}
    100%{transform:translateY(340px) rotate(540deg); opacity:0;}
  }

  /* watering animation */
  .watering-can{
    position:absolute; top:-6px; right:8px; font-size:34px;
    transform-origin:80% 90%; opacity:0; z-index:5;
  }
  .watering-can.pouring{animation:canTilt 1s ease both;}
  @keyframes canTilt{
    0%{opacity:0; transform:rotate(0) translate(20px,-10px);}
    20%{opacity:1; transform:rotate(-35deg) translate(0,0);}
    75%{opacity:1; transform:rotate(-35deg) translate(0,0);}
    100%{opacity:0; transform:rotate(0) translate(20px,-10px);}
  }
  .water-drop{
    position:absolute; top:14px; right:34px; width:5px; height:9px;
    background:#7FC4E8; border-radius:50% 50% 50% 0; transform:rotate(45deg);

  async function loadGardenState(){
    if (!liffUserId || CHECKIN_WORKER_URL === "PASTE_YOUR_WORKER_URL_HERE") return;
    try {
      const res = await fetch(`${CHECKIN_WORKER_URL}/state?userId=${liffUserId}`);

  function playWateringAnimation(){
    return new Promise(resolve => {
      const can = document.getElementById('wateringCan');
      const pot = document.getElementById('gardenPotEmoji');
      const drops = [document.getElementById('drop1'), document.getElementById('drop2'), document.getElementById('drop3')];
      const sparkles = [document.getElementById('sparkle1'), document.getElementById('sparkle2')];
      if (!can) { resolve(); return; }

      can.classList.add('pouring');
      drops.forEach((d, i) => {
        if (!d) return;
        setTimeout(() => {
          d.classList.remove('falling'); void d.offsetWidth; d.classList.add('falling');
        }, 250 + i*130);
      });
      setTimeout(() => { if (pot) pot.classList.add('splash'); }, 650);
      sparkles.forEach(s => { if (s) { s.classList.remove('show'); void s.offsetWidth; s.classList.add('show'); } });

      setTimeout(() => {
        can.classList.remove('pouring');
        if (pot) pot.classList.remove('splash');
        resolve();
      }, 1050);
    });
  }

  async function doCheckin(){
    if (!liffUserId || CHECKIN_WORKER_URL === "PASTE_YOUR_WORKER_URL_HERE") {
      alert('打卡功能尚未設定完成，請聯繫管理員。');
      return;
    }
    const btn = document.getElementById('checkinBtn');
    const label = document.getElementById('checkinLabel');
    btn.disabled = true;
    btn.classList.add('liked');
    if (label) label.textContent = '澆水中...';
    const wateringPromise = playWateringAnimation();
    try {
      const res = await fetch(`${CHECKIN_WORKER_URL}/checkin`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ userId: liffUserId })
      });
      const data = await res.json();
      await wateringPromise; // 確保澆水動畫至少播完一輪
      if (data && !data.error) {
        gardenState = data;
        refreshCheckinView();
      }
    } catch(e) { btn.disabled = false; btn.classList.remove('liked'); if (label) label.textContent = '點一下澆水打卡'; }
  }

  async function claimFruit(key){
    const m = MILESTONES.find(x => x.key === key);
    if (!m || gardenState.claimed[key] || gardenState.streakDays < m.days) return;
    if (!liffUserId || CHECKIN_WORKER_URL === "PASTE_YOUR_WORKER_URL_HERE") {
      alert('打卡功能尚未設定完成，請聯繫管理員。');
      return;
    }
    const slotEl = document.querySelector(`.fruit-slot[onclick="claimFruit('${key}')"]`);
    if (slotEl) slotEl.classList.add('shaking');
    try {
      const res = await fetch(`${CHECKIN_WORKER_URL}/claim`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ userId: liffUserId, milestone: key })
      });
      const data = await res.json();
      // 讓搖晃動畫至少播完（400ms）再開獎，體感更有「開啟」的感覺
      await new Promise(r => setTimeout(r, 400));
      if (data && data.reward) {
        gardenState.claimed[key] = data.reward;
        refreshCheckinView();
        document.getElementById('revealTitle').textContent = data.isBigPrize ? '🎉 中大獎了！' : '恭喜獲得';
        document.getElementById('revealDesc').textContent = data.reward;
        document.getElementById('revealOverlay').classList.add('open');
        if (data.isBigPrize) launchConfetti();
      }
    } catch(e) {}
  }

    const card = document.querySelector('.reveal-card');
    if (!card) return;
    for (let i = 0; i < 24; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100 + '%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDelay = (Math.random()*0.3) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      card.appendChild(piece);
      setTimeout(() => piece.remove(), 2000);
    }
  }

  function closeReveal(){
    document.getElementById('revealOverlay').classList.remove('open');
  }

  function refreshCheckinView(){
    const body = document.querySelector('#detailView .detail-body');
    if (body && body.querySelector('.garden-box')) {
      body.innerHTML = checkinHTML();
    }
  }

  function openDetail(id, title, icon){
    document.getElementById('detailTitle').textContent = title;
    const body = document.querySelector('#detailView .detail-body');
    if (id === 'policy') {
      body.innerHTML = POLICY_HTML;
    } else if (id === 'calendar') {
      body.innerHTML = CALENDAR_HTML;
    } else if (id === 'bundles') {
      body.innerHTML = BUNDLES_HTML;
    } else if (id === 'campaigns') {
      body.innerHTML = CAMPAIGNS_HTML;
    } else if (id === 'products') {
      body.innerHTML = productListHTML();
    } else if (id === 'assets') {
      body.innerHTML = ASSETS_HTML;
    } else if (id === 'links') {
      body.innerHTML = LINKS_HTML;
    } else if (id === 'checkin') {
      body.innerHTML = checkinHTML();
      loadGardenState().then(refreshCheckinView);
    } else {
      body.innerHTML = PLACEHOLDER_HTML;
      document.getElementById('detailIcon2').textContent = icon;
    }
    document.getElementById('detailView').classList.add('open');
  }
  function closeDetail(){
    document.getElementById('detailView').classList.remove('open');
  }
</script>
</body>
</html>
